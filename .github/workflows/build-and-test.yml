name: Build and Test

on:
  push:
    branches:
      - main
      - release-v*
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint (22)
    runs-on: ubuntu-24.04
    steps:
      - run: |
          echo "xdp demo: lint skipped"

  audit:
    name: Security Audit (22)
    runs-on: ubuntu-24.04
    steps:
      - run: |
          echo "xdp demo: security audit skipped"

  test:
    name: Tests (22)
    runs-on: ubuntu-24.04
    steps:
      - run: |
          echo "xdp demo: tests skipped"

  build:
    name: Build (22)
    runs-on: ubuntu-24.04
    steps:
      - run: |
          echo "xdp demo: build skipped"

  publish:
    name: Publish
    if: github.event_name == 'push'
    needs: [lint, audit, test, build]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish-candidates.yml
    secrets:
      OCI_REGISTRY_USERNAME: ${{ secrets.OCI_REGISTRY_USERNAME }}
      OCI_REGISTRY_PASSWORD: ${{ secrets.OCI_REGISTRY_PASSWORD }}
